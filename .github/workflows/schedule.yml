name: BetaFlo Schedule

on:
  schedule:
    - cron: '45 4 * * *'    # 9:45 PM PDT (04:45 UTC)
    - cron: '0 13 * * *'    # 6:00 AM PDT (13:00 UTC)
    - cron: '44 17 * * *'   # TEST: 10:44 AM PDT (17:44 UTC) - sets limit to 30 min
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run'
        required: true
        default: 'night'
        type: choice
        options:
          - morning
          - night
          - test

jobs:
  set-morning:
    if: github.event.schedule == '0 13 * * *' || github.event.inputs.job == 'morning'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake up server
        run: curl -s --max-time 120 "https://betaflo-server.onrender.com/ping"
      - name: Set home limit to 45 min
        run: curl -s --max-time 120 "https://betaflo-server.onrender.com/set_home?minutes=45"

  set-night:
    if: github.event.schedule == '45 4 * * *' || github.event.inputs.job == 'night'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake up server
        run: curl -s --max-time 120 "https://betaflo-server.onrender.com/ping"
      - name: Set home limit to 7 min
        run: curl -s --max-time 120 "https://betaflo-server.onrender.com/set_home?minutes=7"

  set-test:
    if: github.event.schedule == '44 17 * * *' || github.event.inputs.job == 'test'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake up server
        run: curl -s --max-time 120 "https://betaflo-server.onrender.com/ping"
      - name: Set home limit to 30 min (TEST)
        run: curl -s --max-time 120 "https://betaflo-server.onrender.com/set_home?minutes=30"
